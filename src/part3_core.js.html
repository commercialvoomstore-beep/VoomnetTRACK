function isFramed(){ try{ return window.self!==window.top; }catch(e){ return true; } }
/* iframe d'aperçu au bac à sable → le navigateur bloque volontairement les téléchargements */
function sandboxedHere(){
  if(!isFramed()) return false;
  try{ void window.top.location.href; return false; }catch(e){ return true; }
}
function canSavePicker(){ return !isFramed() && typeof window.showSaveFilePicker==="function"; }
function mimeType(type,name){
  if(type==="application/pdf"||/\.pdf$/i.test(name)) return {description:"Document PDF",accept:{"application/pdf":[".pdf"]}};
  if(/csv/i.test(type||"")||/\.csv$/i.test(name))    return {description:"Fichier CSV (tableur)",accept:{"text/csv":[".csv"]}};
  if(/json/i.test(type||"")||/\.json$/i.test(name))  return {description:"Sauvegarde JSON",accept:{"application/json":[".json"]}};
  return null;
}
/* 1. TÉLÉCHARGEMENT DIRECT : le fichier part immédiatement dans le dossier
      « Téléchargements » de l'appareil. Universel, sans boîte de dialogue. */
function downloadToDevice(blob,filename){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },10000);
    return true;
  }catch(e){ return false; }
}
/* 2. « ENREGISTRER SOUS » : choix libre du dossier (Bureau, Documents, clé USB).
      Proposé À LA DEMANDE, car certains navigateurs annulent la boîte automatiquement. */
async function saveWithPicker(blob,filename){
  if(!canSavePicker()) return {ok:false,mode:"unsupported"};
  try{
    const t=mimeType(blob.type,filename);
    const handle=await window.showSaveFilePicker(Object.assign({suggestedName:filename}, t?{types:[t]}:{}));
    const w=await handle.createWritable(); await w.write(blob); await w.close();
    return {ok:true,mode:"picker",name:handle.name||filename};
  }catch(err){
    if(err&&err.name==="AbortError") return {ok:false,mode:"abort"};
    if(downloadToDevice(blob,filename)) return {ok:true,mode:"download",name:filename,sandboxed:sandboxedHere()};
    return {ok:false,mode:"error",err:err};
  }
}
/* Enregistre un fichier SUR L'APPAREIL (téléchargement direct par défaut) */
function saveToDevice(blob,filename){
  return new Promise(function(resolve){
    const ok=downloadToDevice(blob,filename);
    resolve({ok:ok,mode:"download",name:filename,sandboxed:sandboxedHere()});
  });
}

function saveAndTell(blob,filename,onRetry){
  return saveToDevice(blob,filename).then(function(res){
    const ko=Math.round(blob.size/1024);
    if(res.ok&&!res.sandboxed) toast("Enregistré sur votre appareil ✅", filename+" ("+ko+" Ko) → dossier « Téléchargements ».");

    return res;
  });

/* ------------------------------ 6. STOCKAGE ------------------------------ */
const Store = (()=>{
  const KEY="voomnet_track_v2";
  const LEGACY="voomnet_depenses_v1";
  let mode="memory", mem=null;
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); mode="local"; }catch(e){ mode="memory"; }
  function read(){
    if(mode==="local"){
      try{
        let raw=localStorage.getItem(KEY);
        if(!raw){ raw=localStorage.getItem(LEGACY); }      /* migration douce v1 → v2 */
        return raw? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }
    return mem;
  }
  function write(obj){
    if(mode==="local"){ try{ localStorage.setItem(KEY, JSON.stringify(obj)); return true; }catch(e){ return false; } }
    mem=obj; return true;
  }
  return { mode, read, write };
})();

function hashPwd(str){

function tripsOf(month, serviceId, agent){
  return DB.trips.filter(t=>{
    if(month && monthOf(t.date)!==month) return false;
    if(serviceId && t.service!==serviceId) return false;
    if(agent && (t.agent||"").toLowerCase().indexOf(String(agent).toLowerCase())<0) return false;
    return true;
  }).sort((a,b)=> (a.date<b.date?1:a.date>b.date?-1:0));
}
const sum = arr => arr.reduce((s,t)=>s+(Number(t.montant)||0),0);
const sumKm = arr => arr.reduce((s,t)=>s+(Number(t.km)||0),0);
function byService(list){
  const o={}; SERVICES.forEach(s=>o[s.id]={n:0,total:0,km:0});
  list.forEach(t=>{ const k=o[t.service]||(o[t.service]={n:0,total:0,km:0});
    k.n++; k.total+=Number(t.montant)||0; k.km+=Number(t.km)||0; });
  return o;
}
function byTransport(list){
  const o={};
  list.forEach(t=>{ const k=o[t.transport]||(o[t.transport]={n:0,total:0}); k.n++; k.total+=Number(t.montant)||0; });
  return o;
}
function byAgent(list){
  const o={};
  list.forEach(t=>{ const k=o[t.agent]||(o[t.agent]={n:0,total:0,service:t.service,last:t.date});
    k.n++; k.total+=Number(t.montant)||0; if(t.date>k.last) k.last=t.date; });
  return o;
}
function deltaPct(cur,prev){ if(!prev) return null; return (cur-prev)/prev*100; }
function statusTag(st){
  return st==="REGLE"
   ? '<span class="tag" style="background:var(--ok-bg);color:#2A8663">'+ic("check")+' Réglé</span>'
   : '<span class="tag" style="background:var(--warn-bg);color:#8A6F14">'+ic("clock")+' À régler</span>';
}
function serviceTag(id){
  const s=svc(id);
  return '<span class="tag" style="background:'+hexA(s.color2,.12)+';color:'+s.color+'"><span class="dotc" style="background:'+s.color2+'"></span>'+esc(s.short)+'</span>';
}
function serviceLogo(s, cls){
  if(s.logo) return '<img src="'+LOGOS[s.logo].uri+'" alt="'+esc(s.name)+'" class="'+(cls||'')+'">';
  return '<span style="display:grid;place-items:center;color:'+s.color2+'">'+ic(s.icon)+'</span>';
}

/* Déconnexion : gestionnaire délégué — fonctionne pour TOUT élément portant
   l'attribut data-action="logout" ou les boutons dédiés, même ajoutés plus tard. */
function bindLogoutDelegation(){
  if(window.__vtLogoutBound) return;
  window.__vtLogoutBound = true;
  document.addEventListener("click", function(e){
    const el = e.target && e.target.closest ? e.target.closest("[data-action=\"logout\"], #btnLogoutTop, #btnLogoutSide") : null;
    if(!el) return;
    e.preventDefault(); e.stopPropagation();
    logout();
  }, true);
}
function bindPops(){
  const bell=$("#bellPop"), usr=$("#userPop");
  $("#btnBell").onclick=e=>{ e.stopPropagation(); const open=bell.classList.contains("open"); closePops(); if(!open) bell.classList.add("open"); };
  $("#btnUser").onclick=e=>{ e.stopPropagation(); const open=usr.classList.contains("open"); closePops(); if(!open) usr.classList.add("open"); };
  document.addEventListener("click",()=>closePops());
  $$("#userMenu [data-action]").forEach(el=>el.onclick=()=>{
    const a=el.dataset.action; closePops();
    if(a==="params") go("params");
    if(a==="rapports") go("rapports");
    if(a==="new") go("new");
    if(a==="backup") $("#btnBackup").click();
    if(a==="wipe") $("#btnWipe").click();
    if(a==="logout") logout();                     /* retour à l'écran d'accès RH */
    if(a==="logoutAll"){ logout(); }
  });
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); const s=$("#searchInput"); if(s) s.focus(); }
    if(e.key==="Escape"){ closePops(); closeModal(); }
  });
  const s=$("#searchInput");
  if(s) s.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      $("#fSearch").value=s.value;
      page=1; go("registre"); renderRegistre();
      toast("Recherche appliquée","Filtre « "+trunc(s.value,28)+" » dans le registre.","info");
    }
  });
}

function validateForm(){
  let ok=true;
  const need=(cond,errId)=>{ const e=$("#"+errId); if(e) e.classList.toggle("on",!cond); if(!cond) ok=false; return cond; };
  need(!!selService,"err-service");
  ["fDate","fAgent","fMotif","fMontant"].forEach(id=>$("#"+id).classList.remove("err"));
  if(!need(!!$("#fDate").value,"err-date")) $("#fDate").classList.add("err");
  if(!need(!!$("#fAgent").value.trim(),"err-agent")) $("#fAgent").classList.add("err");
  if(!need(!!$("#fMotif").value.trim(),"err-motif")) $("#fMotif").classList.add("err");
  if(!need(!!$("#fTrans").value,"err-trans")) $("#fTrans").classList.add("err");
  if(!need(Number($("#fMontant").value)>0,"err-montant")) $("#fMontant").classList.add("err");
  return ok;

function submitForm(e){
  e.preventDefault();
  if(!validateForm()){ toast("Formulaire incomplet","Merci de corriger les champs signalés.","err"); return; }
  const t={
    date:$("#fDate").value, service:selService, agent:$("#fAgent").value.trim(),
    motif:$("#fMotif").value.trim(), from:$("#fFrom").value.trim(), to:$("#fTo").value.trim(),

  };

  toast("Déplacement enregistré", t.agent+" · "+fmtN(t.montant)+" "+DB.params.devise+" · "+t.transport, "ok");
  const keepDate=$("#fDate").value;
  resetForm(); $("#fDate").value=keepDate;

/* ------------------------------ 13. REGISTRE ------------------------------ */
let sortKey="date", sortDir=-1, page=1;
function filteredTrips(){
  const q=$("#fSearch").value.trim().toLowerCase(), m=$("#fMonth").value,
        s=$("#fService").value, tr=$("#fTransport").value,
        st=$("#fStatut2").value, ju=$("#fJustif2").value;
  let list=DB.trips.filter(t=>{
    if(m && monthOf(t.date)!==m) return false;
    if(s && t.service!==s) return false;
    if(tr && t.transport!==tr) return false;
    if(st && t.statut!==st) return false;
    if(ju && t.justif!==ju) return false;
    if(q){
      const hay=[t.agent,t.motif,t.from,t.to,t.transport,t.note,t.date,svc(t.service).name].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  list.sort((a,b)=>{
    let A=a[sortKey],B=b[sortKey];
    if(sortKey==="montant"||sortKey==="km"){ A=Number(A)||0; B=Number(B)||0; return (A-B)*sortDir; }
    A=String(A||""); B=String(B||"");
    return A.localeCompare(B,"fr")*sortDir;
  });
  return list;
}
function renderRegistre(){
  const list=filteredTrips();
  const per=Number($("#fPerPage").value)||20;
  const pages=Math.max(1,Math.ceil(list.length/per));
  if(page>pages) page=pages;
  const slice=list.slice((page-1)*per,page*per);
  $("#chipFiltered").innerHTML=ic("filter")+" "+list.length+" ligne(s) · <b>"+fmtN(sum(list))+" "+esc(DB.params.devise)+"</b>";
  const wrap=$("#regWrap");
  wrap.innerHTML = slice.length? tableHTML(slice) :
    emptyState("list","Aucune ligne ne correspond","Modifiez les filtres ou enregistrez un nouveau déplacement.");
  bindTableActions(wrap);
  $$("th",wrap).forEach((th,i)=>{
    th.classList.add("no-sort");
    const labels=["date","service","agent","motif","from","transport","montant","statut",""];
    const k=labels[i]; if(!k || th.classList.contains("no-sort") && th.classList.contains("act")) return;
    if(!k) return;
    th.classList.remove("no-sort");
    if(th.classList.contains("act")) return;
    th.innerHTML += '<span class="arw">'+(sortKey===k? (sortDir===1?"▲":"▼") : "↕")+'</span>';
    th.onclick=()=>{ if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; } renderRegistre(); };
  });
  let p='<span class="small">Page '+page+' / '+pages+'</span>';
  p+='<button class="pg" data-p="1">«</button>';
  for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++) p+='<button class="pg '+(i===page?"on":"")+'" data-p="'+i+'">'+i+'</button>';
  p+='<button class="pg" data-p="'+pages+'">»</button>';
  $("#pager").innerHTML=p;
  $$("#pager .pg").forEach(b=>b.onclick=()=>{ page=Number(b.dataset.p); renderRegistre(); window.scrollTo({top:180,behavior:"smooth"}); });
}

    bg.classList.remove("on"); refreshAll(); toast("Modifié","Les informations ont été mises à jour.","ok");
  };
  $("#mDel",box).onclick=()=>{ bg.classList.remove("on"); DB.removeTrip(id); refreshAll(); toast("Supprimé","Ligne retirée du registre.","ok"); };
}

/* ------------------------------ 14. CSV / SAUVEGARDE ------------------------------ */
function csvOf(list){
  const head=["Date","Service","Personne","Motif","Départ","Destination","Transport","Distance (km)","Montant","Statut","Justificatif","Observation"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(";")];
  list.forEach(t=>{
    lines.push([dateFR(t.date),svc(t.service).name,t.agent,t.motif,t.from,t.to,t.transport,
      Number(t.km)||0, t.montant,
      t.statut==="REGLE"?"Réglé":"À régler", t.justif==="NON"?"Aucun":"Fourni", t.note].map(q).join(";"));
  });
  lines.push(["","","","","","","","TOTAL",sum(list),"","",""].map(q).join(";"));
  return "\ufeff"+lines.join("\r\n");
}
function exportCsv(list,name){
  saveAndTell(new Blob([csvOf(list)],{type:"text/csv;charset=utf-8"}), name, function(){ exportCsv(list,name); });
}
function doBackup(){
  const blob=new Blob([JSON.stringify({
    trips:DB.trips,agents:DB.agents,transports:DB.transports,vehicles:DB.vehicles,
    params:DB.params,meta:DB.meta,user:DB.user,accounts:DB.accounts},null,1)],{type:"application/json"});
  saveAndTell(blob,"VOOMNET_Track_sauvegarde_"+todayISO()+".json",function(){ doBackup(); });
}

/* --------------------------- 18. SESSION & CONNEXION --------------------------- */
function sessionAccountId(){ try{ return sessionStorage.getItem("vt_session")||""; }catch(e){ return ""; } }
function currentAccount(){
  const id=sessionAccountId();
  if(!id || id==="guest") return null;   /* aucune session anonyme : identifiant obligatoire */
  return DB.accounts.find(a=>a.id===id) || null;
}
function hasSession(){ return !!currentAccount(); }
function isAdmin(){ const a=currentAccount(); return !!(a && a.admin); }
function isGuest(){ return sessionAccountId()==="guest"; }

function isTouch(){ return window.matchMedia && window.matchMedia("(hover:none)").matches; }
function loginError(msg){
  const e=$("#err-login");
  if(e){ const sp=e.lastElementChild; if(sp) sp.textContent=msg; e.classList.add("on"); }
  const i=$("#loginIdent"), pwd=$("#loginPwd");
  if(i) i.classList.add("err"); if(pwd) pwd.classList.add("err");
  const card=$(".login-card"); if(card){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
}
function showLogin(){
  const L=$("#login"); if(!L) return;
  const pw=$("#loginPwd"); if(pw){ pw.value=""; pw.type="password"; pw.classList.remove("err"); }
  const idf=$("#loginIdent"); if(idf){ idf.value=""; idf.classList.remove("err"); }
  const e=$("#err-login"); if(e) e.classList.remove("on");
  L.classList.remove("hidden","closing");
  setTimeout(()=>{ if(idf && !isTouch()) idf.focus(); }, 430);
}
function connectAccount(acc){
  DB.user={ name:acc.label, role:acc.role, account:acc.id, admin:!!acc.admin };
  DB.save();
  try{ sessionStorage.setItem("vt_session", acc.id); }catch(e){}
  const L=$("#login");
  if(L){ L.classList.add("closing"); setTimeout(()=>L.classList.add("hidden"), 460); }
  renderUser(); refreshAll(); go("dashboard");
  toast("Bienvenue, "+acc.role, acc.label+" · espace de pilotage central de la mobilité.","ok");
}
function doLogin(ident, pwd){
  const id=(ident||"").trim().toLowerCase(), p=(pwd||"");
  const ok = DB.accounts.find(a=> a.login.toLowerCase()===id && a.hash===hashPwd(p));
  if(!ok){
    loginError(!id? "Renseignez votre identifiant." : (!p? "Renseignez votre mot de passe." : "Identifiant ou mot de passe incorrect."));
    return false;
  }
  connectAccount(ok);
  return true;
}
function doGuest(){
  /* Accès anonyme désactivé : la plateforme exige un identifiant nominatif. */
  try{ sessionStorage.removeItem("vt_session"); }catch(e){}
  showLogin();
  toast("Accès refusé","Un identifiant est obligatoire pour entrer dans la plateforme.","err");
}
function logout(){
  try{ sessionStorage.removeItem("vt_session"); }catch(e){}
  if(typeof closePops==="function") closePops();
  if(typeof go==="function") go("dashboard");
  showLogin();
  toast("Déconnexion réussie","Vous êtes revenu à l'écran d'accès.","ok");
}

/* ------------------------------ 18. SPLASH ------------------------------ */
function initSplash(onDone){
  const sp=$("#splash");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!sp){ if(onDone) onDone(); return; }
  hydrateIcons(sp);
  hydrateBrand(sp);

  /* ---- Le splash est joué à CHAQUE lancement de l'application ----
     Pour l'ignorer ponctuellement (test, intégration), ouvrir avec ?splash=0
     ou ?splash=off. Aucun drapeau n'est conservé : un simple rechargement
     rejoue donc l'animation. */
  let skip=false;
  try{
    const p=new URLSearchParams(location.search);
    skip = ["0","off","none","false"].indexOf((p.get("splash")||"").toLowerCase())>=0;
  }catch(e){ skip=false; }
  /* filet de sécurité : si l'onglet est masqué (arrière-plan), on n'attend pas */
  if(skip || document.hidden){
    sp.remove();
    if(onDone) onDone();
    return;
  }

  let closed=false;
  /* séquence : halo 0→1,15 s · logo 0,10→1,05 s · signature 0,46 s ·
     filet doré 0,58 s · jauge 0,45→1,75 s · sortie douce → application vers 2,3 s */
  const DUR = reduce? 300 : 1850;
  const close = ()=>{
    if(closed) return; closed=true;
    sp.classList.add("done");
    setTimeout(()=>{ sp.remove(); if(onDone) onDone(); }, reduce? 0 : 420);
  };
  setTimeout(close, DUR);
  sp.addEventListener("click", close);                                  /* un clic = on entre directement */
  const keyClose = e=>{ if(e.key) close(); };
  document.addEventListener("keydown", keyClose, {once:true});
  /* si l'onglet redevient visible, on respecte la durée normale (aucune coupure) */
}
</script>
