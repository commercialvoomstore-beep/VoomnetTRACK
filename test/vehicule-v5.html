<!doctype html><meta charset="utf-8">
<style>
  :root{
    --primary:#4A2A63; --secondary:#6B4A82; --accent:#C9A227; --accent-600:#A98A1F; --accent-300:#E2C866;
    --gold-real:#B58A2B; --gold-real-2:#E3C05C;
  }
  body{margin:0;background:#F8F7FA;font-family:system-ui;padding:26px}
  .box{background:#fff;border:1px solid #EBE6F0;border-radius:22px;padding:18px;
    background:radial-gradient(760px 280px at 4% -10%, #F4EEFB 0%, rgba(244,238,251,0) 62%),
               radial-gradient(560px 220px at 98% 116%, #FBF5E2 0%, rgba(251,245,226,0) 58%), #fff}
  .lbl{font:700 11px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:#8A7F97;margin-bottom:14px}
  svg{display:block;width:100%;height:auto}

  /* ====== LE REBOND : la caisse pivote sur le pneu avant, la roue reste au sol ====== */
  .hv-body{animation:hvBounce 1.6s cubic-bezier(.33,0,.35,1) infinite;transform-origin:396px 190px;transform-box:view-box}
  @keyframes hvBounce{
    0%   {transform:translateY(0)     rotate(0deg)}
    14%  {transform:translateY(-6.4px) rotate(-.52deg)}   /* le train avant s'enlève */
    30%  {transform:translateY(1.1px)  rotate(.10deg)}    /* retombée sur la suspension */
    44%  {transform:translateY(-2.6px) rotate(-.24deg)}   /* reprise amortie */
    58%  {transform:translateY(.5px)   rotate(.04deg)}
    72%  {transform:translateY(-1px)   rotate(-.09deg)}
    86%  {transform:translateY(.15px)  rotate(.01deg)}
    100% {transform:translateY(0)     rotate(0deg)}
  }
  .hv-tyre{animation:hvTyre 1.6s cubic-bezier(.33,0,.35,1) infinite;transform-box:fill-box;transform-origin:center}
  @keyframes hvTyre{        /* le pneu s'écrase sous la charge puis se détend */
    0%,100%{transform:scale(1,1)}
    14%{transform:scale(1.035,.925)}
    30%{transform:scale(.995,1.02)}
    44%{transform:scale(1.012,.985)}
    58%{transform:scale(1,1)}
  }
  .hv-shadow{animation:hvShadow 1.6s cubic-bezier(.33,0,.35,1) infinite;transform-box:view-box;transform-origin:264px 196px}
  @keyframes hvShadow{
    0%,100%{transform:scaleX(1);opacity:.055}
    14%{transform:scaleX(.955);opacity:.036}
    30%{transform:scaleX(1.012);opacity:.062}
  }
  .hv-route{animation:hvDash 6.5s linear infinite}
  @keyframes hvDash{to{stroke-dashoffset:-132}}
  @media(prefers-reduced-motion:reduce){
    .hv-body,.hv-tyre,.hv-shadow,.hv-route{animation:none}
  }
</style>
<div class="box">
  <div class="lbl">Véhicule v6 — rebond du train avant (contrôle)</div>
  <svg viewBox="0 0 560 250" role="img" aria-label="Suivi des déplacements">
    <defs>
      <pattern id="hv-bp" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M20 0H0V20" fill="none" stroke="#EFE8F4" stroke-width="1"/>
      </pattern>
    </defs>

    <ellipse class="hv-shadow" cx="264" cy="196" rx="178" ry="9" fill="#4A2A63" opacity=".055"/>

    <!-- ROUES : plantées au sol (dessinées AVANT la caisse, qui masque leur moitié haute) -->
    <g class="hv-tyre">
      <g fill="#fff" stroke="#4A2A63" stroke-width="2.6">
        <circle cx="176" cy="170" r="22"/><circle cx="396" cy="170" r="22"/>
      </g>
      <g fill="none" stroke="#6B4A82" stroke-width="1.5">
        <circle cx="176" cy="170" r="9.5"/><circle cx="396" cy="170" r="9.5"/>
        <path d="M176 181.5v-2.5M167.5 170H165M186.5 170h-2.5"/>
        <path d="M396 181.5v-2.5M387.5 170H385M406.5 170h-2.5"/>
      </g>
      <g fill="#C9A227"><circle cx="176" cy="170" r="3.4"/><circle cx="396" cy="170" r="3.4"/></g>
    </g>

    <!-- CAISSE COMPLÈTE : pivote sur le pneu avant -->
    <g class="hv-body">
      <!-- carrosserie d'un seul tenant, fond blanc : elle masque le haut des roues -->
      <path d="M80 168V118a14 14 0 0 1 14-14h206l56 30h88a14 14 0 0 1 14 14v20z"
            fill="#fff" stroke="#4A2A63" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- bas de caisse + passages de roues -->
      <path d="M80 168h69M149 168a27 27 0 0 1 54 0M203 168h166M369 168a27 27 0 0 1 54 0M423 168h35"
            fill="none" stroke="#4A2A63" stroke-width="2.4" stroke-linecap="round"/>
      <!-- feux arrière -->
      <path d="M80 128h5v15h-5z" fill="#F7E7E5" stroke="#B4645F" stroke-width="1.3"/>
      <!-- livrée : filet doré + marque -->
      <path d="M96 141h132" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-linecap="round"/>
      <text x="96" y="131" font-family="system-ui" font-size="10.5" font-weight="700" letter-spacing="2.8" fill="#4A2A63" fill-opacity=".58">VOOMNET</text>
      <!-- portière coulissante -->
      <path d="M240 122v46" fill="none" stroke="#9C87B2" stroke-width="1.5"/>
      <path d="M252 136h22" fill="none" stroke="#4A2A63" stroke-width="2.2" stroke-linecap="round"/>
      <!-- vitrage cabine -->
      <path d="M306 118h34l15 24h-49z" fill="#EFE8F4" fill-opacity=".7" stroke="#4A2A63" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M312 124h24l7 12h-31z" fill="#fff" fill-opacity=".55"/>
      <!-- rétroviseur -->
      <path d="M304 114l4-8" fill="none" stroke="#4A2A63" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="308" y="95" width="15" height="10" rx="4" fill="#fff" stroke="#4A2A63" stroke-width="1.8"/>
      <!-- phare -->
      <path d="M430 144h12a6 6 0 0 1 6 6v6h-18z" fill="#FBF7E7" stroke="#4A2A63" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- TRAJET : pointillés animés + départ + destination -->
    <path class="hv-route" d="M44 216h432" fill="none" stroke="#DFD2E9" stroke-width="2.2" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="44" cy="216" r="5" fill="#fff" stroke="#6B4A82" stroke-width="2.4"/>
    <g transform="translate(486 176)">
      <path d="M12 40c0-4 12-16 12-26A12 12 0 1 0 0 14c0 10 12 22 12 26z" fill="#fff" stroke="#C9A227" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="12" cy="14" r="4.6" fill="#C9A227"/>
    </g>
    <g stroke="#C9A227" stroke-width="2.4" stroke-linecap="round" opacity=".8">
      <path d="M34 132h20"/><path d="M26 148h12"/>
    </g>
  </svg>
</div>
